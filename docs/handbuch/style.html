<style>
/* Layout: one 780px column like "Klangwege im Pult" – numbered section cards, grouped contents at the top */
:root{
  /* Farben: Aurora-Theme „Kante“ (dunkel, in beiden Farbschemata) */
  --bg:#1B1C1E; --surface:#232427; --surface2:#2A2B2E;
  --ink:#C9CBD0; --muted:#8B8E95; --line:#303135;
  --audio:#4F9DB5; --cv:#D39B57; --ok:#6FB08A;
  --audio-soft:#1C2D33; --cv-soft:#33291C; --ok-soft:#1D2B22;
  --shadow:0 1px 2px rgba(0,0,0,.45); color-scheme:dark;
  --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}


*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:15.5px; line-height:1.62;
  margin:0; padding-block:40px 64px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px))}
.wrap{max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:40px}
h1{font-family:var(--display); font-weight:700; font-size:clamp(36px,7.5vw,56px); line-height:1; margin:0; text-wrap:balance}
h2{font-family:var(--display); font-weight:600; font-size:24px; letter-spacing:.02em; text-transform:uppercase; margin:0; text-wrap:balance}
h3{font-family:var(--display); font-weight:600; font-size:20px; letter-spacing:.03em; text-transform:uppercase; margin:22px 0 8px; color:var(--cv); text-wrap:balance; scroll-margin-top:16px}
p{margin:0 0 12px}
a{color:var(--audio); text-underline-offset:2px}
a[target="_blank"]::after{content:" ↗"; font-size:.85em}
code{font-family:var(--mono); font-size:.86em; background:var(--surface2); border:1px solid var(--line); border-radius:2px; padding:0 4px; overflow-wrap:anywhere}
b{font-weight:600}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--cv); margin:0 0 10px}
.lede{font-size:17.5px; color:var(--muted); max-width:64ch; margin:14px 0 0}
.chip{display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:2px; border:1px solid; white-space:nowrap; margin-top:8px}
.chip-now{color:var(--ok); border-color:var(--ok); background:var(--ok-soft)}
.facts{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
.facts span{font-family:var(--mono); font-size:11.5px; color:var(--muted); border:1px solid var(--line); background:var(--surface); border-radius:2px; padding:3px 8px}
section{display:flex; flex-direction:column; gap:28px}
.patch-card{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); overflow:hidden; scroll-margin-top:16px}
.ph{display:flex; align-items:flex-start; gap:16px; padding:18px 20px 14px; border-bottom:1px solid var(--line); background:var(--surface2)}
.num{font-family:var(--display); font-weight:700; font-size:34px; line-height:.85; color:var(--cv); flex:none; width:38px; font-variant-numeric:tabular-nums}
.ph-main{flex:1; min-width:0}
.pb{padding:18px 20px; min-width:0}
.pb>h3:first-child{margin-top:0}
h4{font-family:var(--display); font-weight:600; font-size:15px; letter-spacing:.02em; margin:18px 0 6px; color:var(--ink)}
.lst{margin:0 0 12px; padding-left:22px}
.lst li{margin:3px 0}
.lst .lst{margin:4px 0 0}
.tbl{overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:3px}
.tbl table{border-collapse:collapse; width:100%; font-size:13.5px; line-height:1.5}
.tbl th{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; color:var(--muted); text-align:left; background:var(--surface2); padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:bottom}
.tbl td{padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; min-width:7em}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-variant-numeric:tabular-nums}
.tbl b{color:var(--audio)}
.scr{margin:14px 0}
.scr img{display:block; width:100%; height:auto; border:1px solid var(--line); border-radius:3px; background:#000}
.scr figcaption{font-size:12.5px; color:var(--muted); margin-top:4px}
.scr-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0}
.scr-grid .scr{margin:0}
@media (max-width:560px){ .scr-grid{grid-template-columns:1fr} }
header .chip{white-space:normal}
.chart{margin:14px 0}
.chart svg{display:block; width:100%; height:auto; color:var(--ink)}
.toc{background:var(--surface); border:1px solid var(--line); border-radius:4px; box-shadow:var(--shadow); padding:18px 20px; scroll-margin-top:16px}
.toc ol{list-style:none; margin:0; padding:0; display:grid}
.toc li{border-bottom:1px solid var(--line); padding:8px 0}
.toc li:last-child{border-bottom:none}
.toc .tl{display:flex; gap:10px; align-items:baseline; color:var(--ink); text-decoration:none}
.toc .tl:hover .tt,.toc .tl:focus-visible .tt{color:var(--audio)}
.tn{font-family:var(--display); font-weight:700; font-size:20px; line-height:1.2; color:var(--cv); font-variant-numeric:tabular-nums; width:28px; flex:none}
.tt{font-family:var(--display); font-weight:600; font-size:18px; letter-spacing:.02em; text-transform:uppercase; line-height:1.2}
.ts{font-size:13.5px; color:var(--muted); line-height:1.55; margin:2px 0 0 38px}
.ts a{color:var(--muted); text-decoration:none; white-space:nowrap}
.ts a:hover,.ts a:focus-visible{color:var(--audio); text-decoration:underline}
.toc-grp{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:16px 0 2px}
.toc>.eyebrow{margin-bottom:0}
a:focus-visible{outline:2px solid var(--audio); outline-offset:2px}
.backtop{display:inline-block; margin-top:14px; font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); text-decoration:none}
.backtop:hover{color:var(--audio)}
.partnote{font-size:13.5px; color:var(--muted); border-left:3px solid var(--cv); padding:4px 0 4px 12px; margin:0 0 16px}
.partnote b{color:var(--ink)}
.patch{display:grid; grid-template-columns:auto 1fr; gap:3px 14px; align-items:baseline; font-family:var(--mono); font-size:12.8px; line-height:1.7; background:var(--surface2,var(--bg)); border:1px solid var(--line); border-radius:3px; padding:12px 16px; margin:10px 0 14px}
.patch .n{color:var(--cv); font-size:10.5px}
.patch .r{overflow-wrap:anywhere}
.patch b{font-weight:500; color:var(--audio)}
.patch i{font-style:normal; color:var(--cv)}
.kern{border-left:2px solid var(--audio); padding-left:14px; margin:12px 0}
.kern strong{color:var(--audio)}
.mods{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin:10px 0 0; overflow-wrap:anywhere}
.partnote{font-size:13.5px; color:var(--muted); border-left:3px solid var(--cv); padding:4px 0 4px 12px; margin:0 0 16px}
.partnote b{color:var(--ink)}
.box-local{font-size:13.5px; color:var(--muted); background:var(--cv-soft); border-left:3px solid var(--cv); padding:8px 12px; margin:0 0 16px; border-radius:0 3px 3px 0}
.box-local b{color:var(--ink)}
/* Vorlesen */
.tts-start{display:inline-flex; align-items:center; gap:6px; margin:14px 0 0; font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--audio); background:var(--audio-soft); border:1px solid var(--audio); border-radius:3px; padding:8px 12px; cursor:pointer}
.tts-here{margin-top:6px; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); background:none; border:1px solid var(--line); border-radius:2px; padding:3px 8px; cursor:pointer}
.tts-start:hover,.tts-here:hover{color:var(--audio); border-color:var(--audio)}
.tts-start:focus-visible,.tts-here:focus-visible,.tts-bar button:focus-visible,.tts-bar select:focus-visible{outline:2px solid var(--audio); outline-offset:2px}
.tts-on{background:var(--audio-soft)!important; outline:2px solid var(--audio); outline-offset:2px; border-radius:2px}
.tts-bar{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line); box-shadow:0 -2px 8px rgba(0,0,0,.12);
  padding-top:8px; padding-bottom:calc(8px + env(safe-area-inset-bottom,0px)); padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px))}
.tts-in{max-width:780px; margin:0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tts-bar button{min-width:44px; height:40px; font-size:17px; color:var(--ink); background:var(--surface2); border:1px solid var(--line); border-radius:3px; cursor:pointer; padding:0 10px}
.tts-bar .tts-play{color:var(--surface); background:var(--audio); border-color:var(--audio)}
.tts-bar select{height:40px; font-family:var(--mono); font-size:12px; color:var(--ink); background:var(--surface2); border:1px solid var(--line); border-radius:3px; padding:0 6px}
.tts-where{flex:1 1 140px; min-width:0; font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tts-msg{flex-basis:100%; font-size:12.5px; color:var(--cv)}
body.tts-open{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
footer{font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:18px}
@media (max-width:480px){ .ts{margin-left:0} .num{width:30px; font-size:28px} .ph,.pb{padding-left:16px; padding-right:16px} }
</style>
